<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Algoritmo Genético - Configuración</title>

    <!-- CSS servido por Spring (Thymeleaf) -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <!-- Alpine.js -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body>

<!-- x-data contiene el estado y helpers -->
<div class="container" x-data="configForm()">
    <h1>⚙️ Configuración del Algoritmo Genético</h1>

    <!-- referencia del formulario (x-ref) para envíos programáticos -->
    <form x-ref="form"
          id="configForm"
          method="POST"
          enctype="multipart/form-data"
          :action="computedAction"
          @submit="onSubmit($event)"
          novalidate>

        <!-- --- Configuración general --- -->
        <div class="config-section">
            <h3>🎛️ Configuración general</h3>

            <div class="param-group">
                <label>Tipo de entrada:</label>
                <div>
                    <label><input type="radio" name="inputType" value="random" x-model="inputType"> 🎲 Aleatoria</label>
                    <label><input type="radio" name="inputType" value="file" x-model="inputType"> 📄 Archivo .txt</label>
                </div>
            </div>

            <!-- Campo archivo: :required dinámico -->
            <div class="param-group" x-show="inputType === 'file'" x-transition>
                <label for="file">Archivo .txt con binarios:</label>
                <input type="file" id="file" name="file" accept=".txt"
                       :required="inputType === 'file'"
                       class="form-control">
            </div>

            <!-- Tamaño de población: :required dinámico -->
            <div class="param-group" x-show="inputType !== 'file'" x-transition>
                <label for="populationSize">Tamaño de población:</label>
                <input type="number" id="populationSize" name="populationSize"
                       value="4200" min="3"
                       :required="inputType !== 'file'"
                       class="form-control">
            </div>

            <div class="param-group">
                <label>Modo de ejecución:</label>
                <div>
                    <label><input type="radio" name="executionMode" value="normal" x-model="executionMode"> 🚀 Normal</label>
                    <label><input type="radio" name="executionMode" value="elitist" x-model="executionMode"> 🔬 Elitista</label>
                </div>
            </div>

            <div class="param-group">
                <label for="functionType">Función objetivo:</label>
                <select id="functionType" name="functionType" x-model="functionType" required class="form-control">
                    <option value="function5">Cuadrática 1: f(x) = (x² - 1)²</option>
                    <option value="function2">Cuadrática 2: f(x) = x² + 2x + 5</option>
                    <option value="credit">Riesgo crediticio</option>
                    <option value="consumo">Preferencias de consumo</option>
                    <option value="farmacologia">Optimización farmacológica</option>
                    <option value="transporte">Optimización rutas de transporte</option>
                    <option value="netflix">Recomendaciones de peliculas en Netflix</option>
                </select>
            </div>
        </div>

        <!-- --- Parámetros y rangos --- -->
        <div class="config-section">
            <h3>🔢 Parámetros y rangos</h3>

            <div class="param-group" x-show="isMathFunction" x-transition>
                <label for="xmin">Rango mínimo (xmin):</label>
                <input type="number" id="xmin" name="xmin" step="any" value="-3"
                       class="form-control"
                       :required="isMathFunction">
            </div>

            <div class="param-group" x-show="isMathFunction" x-transition>
                <label for="xmax">Rango máximo (xmax):</label>
                <input type="number" id="xmax" name="xmax" step="any" value="3"
                       class="form-control"
                       :required="isMathFunction">
            </div>

            <div class="param-group">
                <label for="L">Precisión (L - bits):</label>
                <input type="number" id="L" name="L" min="1" max="64" value="15" required class="form-control">
            </div>

            <div class="param-group">
                <label for="numGenerations">Número de generaciones:</label>
                <input type="number" id="numGenerations" name="numGenerations" min="3" max="5000" value="1000" required class="form-control">
            </div>
        </div>

        <!-- --- Estrategias genéticas --- -->
        <div class="config-section">
            <h3>🧬 Estrategias genéticas y tasas</h3>

            <!-- Solo ocultamos tipos cuando es elitista -->
            <div x-show="executionMode !== 'elitist'" x-transition>
                <div class="param-group">
                    <label for="selectionType">Método de selección:</label>
                    <select id="selectionType" name="selectionType" class="form-control">
                        <option value="roulette">Ruleta</option>
                        <option value="tournament">Torneo</option>
                        <option value="hierarchical">Jerárquica</option>
                    </select>
                </div>

                <div class="param-group">
                    <label for="mutationType">Tipo de mutación:</label>
                    <select id="mutationType" name="mutationType" class="form-control">
                        <option value="simple">Bit flip</option>
                        <option value="inversive">Inversiva</option>
                        <option value="swap">Intercambio</option>
                        <option value="heuristic">Heurística</option>
                    </select>
                </div>

                <div class="param-group">
                    <label for="crossoverType">Tipo de cruce:</label>
                    <select id="crossoverType" name="crossoverType" class="form-control">
                        <option value="single">Un punto</option>
                        <option value="double">Dos puntos</option>
                        <option value="uniform">Uniforme</option>
                    </select>
                </div>
            </div>

            <!-- Tasas siempre visibles -->
            <div class="param-group">
                <label for="mutationRate">Tasa de mutación:</label>
                <input type="number" id="mutationRate" name="mutationRate" step="0.001" min="0" max="1" value="0.001" required class="form-control">
            </div>

            <div class="param-group">
                <label for="crossoverRate">Tasa de cruce:</label>
                <input type="number" id="crossoverRate" name="crossoverRate" step="0.01" min="0" max="1" value="0.8" required class="form-control">
            </div>
        </div>

        <button type="submit" class="submit-btn">🚀 Ejecutar Algoritmo Genético</button>
    </form>
</div>

<!-- Alpine data script -->
<script>
    function configForm() {
        return {
            // estado inicial
            inputType: 'random',
            executionMode: 'normal',
            functionType: 'function5',

            // computed property para action
            get computedAction() {
                return this.executionMode === 'elitist' ? '/executeElitist' : '/uploadTxt';
            },

            // boolean helper
            get isMathFunction() {
                return !['credit', 'consumo', 'farmacologia', 'transporte', 'netflix'].includes(this.functionType);
            },

            // handler opcional para submit (aquí validamos HTML5 manualmente si quieres)
            onSubmit(event) {
                // Si quieres dejar la validación nativa del navegador, comenta lo siguiente.
                // Ejemplo: forzar validación nativa manual antes de enviar:
                // if (!this.$refs.form.checkValidity()) {
                //   // Dejar que el navegador muestre mensajes
                //   this.$refs.form.reportValidity();
                //   event.preventDefault();
                //   return;
                // }

                // No hacemos preventDefault: dejamos que el navegador envíe el formulario
                // a la URL ya calculada en :action (computedAction).
                // Si prefieres interceptar y hacer fetch/AJAX, puedes hacerlo aquí.
            }
        }
    }
</script>

</body>
</html>
